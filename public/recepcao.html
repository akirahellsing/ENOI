<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Recepção e Triagem — Hospital ENOI</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-page: #f8fafc;
            --bg-surface: #ffffff;
            --primary: #0f4c81;
            --primary-hover: #0a365c;
            --accent: #0d9488;
            --text-main: #0f172a;
            --text-muted: #64748b;
            --border-subtle: #e2e8f0;
            --warning-bg: #fffbeb;
            --warning-border: #fcd34d;
            --warning-text: #b45309;
        }

        * { box-sizing: border-box; font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif; }
        
        body { 
            background: var(--bg-page); 
            color: var(--text-main); 
            margin: 0;
            padding: 40px; 
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .wrapper {
            width: 100%;
            max-width: 1200px;
            display: grid;
            grid-template-columns: 1fr 1.1fr;
            gap: 32px;
        }

        .box { 
            background: var(--bg-surface); 
            padding: 36px; 
            border-radius: 16px; 
            box-shadow: 0 4px 24px rgba(15, 23, 42, 0.04); 
            border: 1px solid var(--border-subtle);
            display: flex;
            flex-direction: column;
        }

        .box-header {
            border-bottom: 1px solid var(--border-subtle);
            padding-bottom: 18px;
            margin-bottom: 24px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        h2 { 
            color: var(--text-main); 
            margin: 0; 
            font-size: 1.25rem;
            font-weight: 700;
            letter-spacing: -0.01em;
        }

        .badge-count {
            background: #e0f2fe;
            color: var(--primary);
            font-size: 0.85rem;
            font-weight: 700;
            padding: 4px 12px;
            border-radius: 9999px;
        }

        label { 
            color: #334155; 
            font-size: 0.875rem; 
            font-weight: 600; 
            display: block; 
            margin-top: 18px; 
            margin-bottom: 8px;
        }

        input[type="text"], select { 
            width: 100%; 
            padding: 12px 16px; 
            border-radius: 10px; 
            border: 1px solid #cbd5e1; 
            background: var(--bg-page); 
            color: var(--text-main); 
            font-size: 0.95rem; 
            transition: all 0.2s ease;
        }

        input[type="text"]:focus, select:focus {
            outline: none;
            border-color: var(--primary);
            background: var(--bg-surface);
            box-shadow: 0 0 0 3px rgba(15, 76, 129, 0.1);
        }

        .checkbox-area { 
            display: flex; 
            align-items: center; 
            gap: 12px; 
            margin-top: 24px; 
            background: var(--warning-bg);
            padding: 14px 16px;
            border-radius: 10px;
            border: 1px solid var(--warning-border);
            cursor: pointer;
        }

        .checkbox-area input { 
            width: 18px; 
            height: 18px; 
            margin: 0; 
            accent-color: #d97706; 
            cursor: pointer;
        }

        .checkbox-area label { 
            margin: 0; 
            color: var(--warning-text); 
            font-weight: 600;
            cursor: pointer; 
        }
        
        button { 
            width: 100%; 
            padding: 14px 20px; 
            border-radius: 10px; 
            border: none; 
            background: var(--primary); 
            color: white; 
            font-weight: 600; 
            font-size: 1rem;
            cursor: pointer; 
            margin-top: 28px; 
            box-shadow: 0 4px 12px rgba(15, 76, 129, 0.18);
            transition: all 0.2s ease;
        }

        button:hover { 
            background: var(--primary-hover); 
            transform: translateY(-1px);
        }

        .lista-container {
            flex: 1;
            overflow-y: auto;
            max-height: 520px;
            padding-right: 4px;
        }

        .item-fila { 
            background: var(--bg-page); 
            padding: 16px 20px; 
            border-radius: 12px; 
            margin-bottom: 12px; 
            display: flex; 
            justify-content: space-between; 
            align-items: center; 
            border: 1px solid var(--border-subtle);
            border-left: 4px solid var(--primary);
        }

        .pref { 
            border-left: 4px solid #f59e0b; 
            background: var(--warning-bg); 
            border-color: #fde68a;
        }

        .tag-pref {
            display: inline-block;
            font-size: 0.7rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            background: #fef3c7;
            color: var(--warning-text);
            padding: 2px 8px;
            border-radius: 4px;
            margin-left: 8px;
            vertical-align: middle;
        }
    </style>
</head>
<body>

<div class="wrapper">
    <div class="box">
        <div class="box-header">
            <h2>Admissão de Paciente</h2>
        </div>

        <label for="nome">Nome Completo</label>
        <input type="text" id="nome" placeholder="Digite o nome do paciente">

        <label for="consultorio">Unidade / Consultório de Destino</label>
        <select id="consultorio">
            <option value="Consultório 01">Consultório 01</option>
            <option value="Consultório 02">Consultório 02</option>
            <option value="Consultório 03">Consultório 03</option>
            <option value="Triagem">Triagem</option>
        </select>

        <label for="medico">Profissional Responsável</label>
        <select id="medico">
            <option value="Dr. Carlos Silva">Dr. Carlos Silva — Clínico Geral</option>
            <option value="Dra. Ana Souza">Dra. Ana Souza — Pediatria</option>
            <option value="Dr. Roberto Mendes">Dr. Roberto Mendes — Cardiologia</option>
            <option value="Enfermeira Juliana">Enfermeira Juliana — Triagem</option>
        </select>

        <div class="checkbox-area" onclick="document.getElementById('preferencial').click()">
            <input type="checkbox" id="preferencial" onclick="event.stopPropagation()">
            <label for="preferencial" onclick="event.stopPropagation()">Atendimento Prioritário / Preferencial</label>
        </div>

        <button onclick="cadastrar()">Gerar Senha de Atendimento</button>
    </div>

    <div class="box">
        <div class="box-header">
            <h2>Fila de Espera</h2>
            <span class="badge-count"><span id="total">0</span> aguardando</span>
        </div>
        <div id="listaFila" class="lista-container"></div>
    </div>
</div>

<script src="/socket.io/socket.io.js"></script>
<script>
    const socket = io();

    function cadastrar() {
        const nome = document.getElementById('nome').value;
        const consultorio = document.getElementById('consultorio').value;
        const medico = document.getElementById('medico').value;
        const preferencial = document.getElementById('preferencial').checked;

        if (!nome.trim()) return alert("Informe o nome completo do paciente.");

        socket.emit('adicionar-paciente', { nome: nome.trim(), consultorio, medico, preferencial });

        document.getElementById('nome').value = '';
        document.getElementById('preferencial').checked = false;
        document.getElementById('nome').focus();
    }

    function renderizarFila(fila) {
        document.getElementById('total').innerText = fila.length;
        const container = document.getElementById('listaFila');
        if (fila.length === 0) {
            container.innerHTML = '<div style="color: #94a3b8; text-align: center; margin-top: 60px; font-size: 0.95rem;">Nenhum paciente na fila de espera</div>';
            return;
        }
        container.innerHTML = fila.map(p => `
            <div class="item-fila ${p.preferencial ? 'pref' : ''}">
                <div>
                    <div style="margin-bottom: 4px;">
                        <strong style="font-size: 1.05rem; color: #0f4c81;">${p.senha}</strong>
                        <span style="color: #cbd5e1; margin: 0 6px;">|</span>
                        <strong style="color: #0f172a; font-weight: 600;">${p.nome}</strong>
                        ${p.preferencial ? '<span class="tag-pref">Prioritário</span>' : ''}
                    </div>
                    <small style="color: #64748b;">Check-in às ${p.horarioEntrada}</small>
                </div>
                <div style="text-align: right;">
                    <span style="color: #0d9488; font-weight: 700; font-size: 0.9rem; display:block; margin-bottom: 2px;">${p.consultorio}</span>
                    <small style="color: #64748b;">${p.medico}</small>
                </div>
            </div>
        `).join('');
    }

    socket.on('estado-inicial', (dados) => renderizarFila(dados.fila));
    socket.on('atualizar-fila', (fila) => renderizarFila(fila));
</script>
</body>
</html>
