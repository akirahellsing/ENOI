<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Estação Clínica — Hospital ENOI</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-page: #f8fafc;
            --bg-surface: #ffffff;
            --primary: #0f4c81;
            --primary-hover: #0a365c;
            --accent: #0d9488;
            --accent-hover: #0f766e;
            --text-main: #0f172a;
            --text-muted: #64748b;
            --border-subtle: #e2e8f0;
        }

        * { box-sizing: border-box; font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif; }
        
        body { 
            background: var(--bg-page); 
            color: var(--text-main); 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            min-height: 100vh; 
            margin: 0; 
            padding: 24px; 
        }

        .container { 
            width: 100%;
            max-width: 500px; 
            background: var(--bg-surface); 
            padding: 40px; 
            border-radius: 16px; 
            box-shadow: 0 10px 30px rgba(15, 23, 42, 0.05); 
            border: 1px solid var(--border-subtle);
        }

        .header-login {
            text-align: center;
            margin-bottom: 28px;
        }

        .header-login h2 { 
            color: var(--text-main); 
            margin: 0 0 6px 0; 
            font-size: 1.4rem;
            font-weight: 700;
            letter-spacing: -0.02em;
        }

        .header-login p {
            color: var(--text-muted);
            font-size: 0.9rem;
            margin: 0;
        }

        label { 
            color: #334155; 
            font-size: 0.875rem; 
            font-weight: 600; 
            display: block; 
            margin-top: 18px; 
            margin-bottom: 8px; 
        }

        select { 
            width: 100%; 
            padding: 12px 16px; 
            border-radius: 10px; 
            font-size: 0.95rem; 
            background: var(--bg-page); 
            color: var(--text-main); 
            border: 1px solid #cbd5e1; 
            transition: all 0.2s ease;
        }

        select:focus {
            outline: none;
            border-color: var(--primary);
            background: var(--bg-surface);
        }

        button { 
            width: 100%; 
            padding: 14px 20px; 
            border-radius: 10px; 
            font-size: 0.95rem; 
            border: none; 
            font-weight: 600; 
            cursor: pointer; 
            transition: all 0.2s ease; 
        }

        .btn-salvar { 
            background: var(--primary); 
            color: white; 
            margin-top: 28px; 
            box-shadow: 0 4px 12px rgba(15, 76, 129, 0.18);
        }
        .btn-salvar:hover { background: var(--primary-hover); }

        .painel-atendimento { display: none; }

        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid var(--border-subtle);
            padding-bottom: 16px;
            margin-bottom: 24px;
        }

        .sala-badge {
            background: #e0f2fe;
            color: var(--primary);
            font-weight: 700;
            font-size: 0.85rem;
            padding: 6px 14px;
            border-radius: 8px;
        }

        .medico-nome {
            color: var(--text-muted);
            font-size: 0.875rem;
            font-weight: 600;
        }

        .atual { 
            background: var(--bg-page); 
            padding: 28px 24px; 
            border-radius: 14px; 
            text-align: center; 
            margin-bottom: 20px; 
            border: 1px solid var(--border-subtle); 
        }

        .atual small {
            color: var(--text-muted);
            font-weight: 700;
            font-size: 0.75rem;
            letter-spacing: 0.08em;
            text-transform: uppercase;
        }

        .btn-chamar { 
            background: var(--accent); 
            color: white; 
            font-size: 1.05rem; 
            padding: 16px;
            box-shadow: 0 4px 14px rgba(13, 148, 136, 0.22);
        }
        .btn-chamar:hover { background: var(--accent-hover); transform: translateY(-1px); }
        
        .btn-rechamar { 
            background: #ffffff; 
            color: var(--primary); 
            border: 1px solid #cbd5e1;
            display: none; 
            margin-top: 16px; 
            font-size: 0.875rem;
            padding: 10px 16px;
        }
        .btn-rechamar:hover { background: #f1f5f9; }

        .fila-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 28px;
            margin-bottom: 12px;
        }

        .fila-header h3 {
            margin: 0;
            font-size: 0.9rem;
            font-weight: 700;
            color: #334155;
            text-transform: uppercase;
            letter-spacing: 0.04em;
        }

        .fila-item { 
            background: var(--bg-page); 
            padding: 14px 16px; 
            border-radius: 10px; 
            margin-top: 8px; 
            display: flex; 
            justify-content: space-between; 
            align-items: center; 
            border: 1px solid var(--border-subtle);
            border-left: 4px solid var(--primary);
        }

        .btn-trocar { 
            background: transparent; 
            color: var(--text-muted); 
            font-size: 0.85rem; 
            margin-top: 24px; 
            border: 1px solid var(--border-subtle);
            padding: 10px;
        }
        .btn-trocar:hover { background: var(--bg-page); color: var(--text-main); }
    </style>
</head>
<body>

<div class="container">
    <div id="divLogin">
        <div class="header-login">
            <h2>Acesso ao Consultório</h2>
            <p>Selecione a unidade de atendimento e o profissional</p>
        </div>

        <label for="selConsultorio">Consultório / Setor</label>
        <select id="selConsultorio">
            <option value="Consultório 01">Consultório 01</option>
            <option value="Consultório 02">Consultório 02</option>
            <option value="Consultório 03">Consultório 03</option>
            <option value="Triagem">Triagem</option>
        </select>

        <label for="selMedico">Profissional</label>
        <select id="selMedico">
            <option value="Dr. Carlos Silva">Dr. Carlos Silva — Clínico Geral</option>
            <option value="Dra. Ana Souza">Dra. Ana Souza — Pediatria</option>
            <option value="Dr. Roberto Mendes">Dr. Roberto Mendes — Cardiologia</option>
            <option value="Enfermeira Juliana">Enfermeira Juliana — Triagem</option>
        </select>

        <button class="btn-salvar" onclick="entrarConsultorio()">Iniciar Sessão</button>
    </div>

    <div id="divPainel" class="painel-atendimento">
        <div class="top-bar">
            <span id="tituloSala" class="sala-badge">Consultório --</span>
            <span id="subMedico" class="medico-nome">--</span>
        </div>

        <div class="atual">
            <small>Em Atendimento</small>
            <h1 id="pacienteAtual" style="color: #0f172a; margin: 12px 0 0 0; font-size: 1.65rem; font-weight: 700;">Nenhum paciente</h1>
            <button id="btnRechamar" class="btn-rechamar" onclick="rechamar()">Repetir Chamada no Painel</button>
        </div>

        <button class="btn-chamar" onclick="chamarProximo()">Chamar Próximo Paciente</button>

        <div class="fila-header">
            <h3>Fila da Unidade</h3>
            <span style="font-size: 0.85rem; font-weight: 600; color: #64748b;"><span id="qtdSala">0</span> pacientes</span>
        </div>
        <div id="minhaFila" style="max-height: 220px; overflow-y: auto;"></div>

        <button class="btn-trocar" onclick="trocarConsultorio()">Alterar Consultório / Encerrar Sessão</button>
    </div>
</div>

<script src="/socket.io/socket.io.js"></script>
<script>
    const socket = io();
    let filaCompleta = [];
    let meuConsultorioAtual = '';
    let meuMedicoAtual = '';
    let ultimoChamadoPorMim = null;

    window.addEventListener('load', () => {
        const salvoConsultorio = localStorage.getItem('medico_consultorio');
        const salvoMedico = localStorage.getItem('medico_nome');
        if (salvoConsultorio && salvoMedico) {
            meuConsultorioAtual = salvoConsultorio;
            meuMedicoAtual = salvoMedico;
            mostrarPainelAtendimento();
        }
    });

    function entrarConsultorio() {
        meuConsultorioAtual = document.getElementById('selConsultorio').value;
        meuMedicoAtual = document.getElementById('selMedico').value;

        localStorage.setItem('medico_consultorio', meuConsultorioAtual);
        localStorage.setItem('medico_nome', meuMedicoAtual);

        mostrarPainelAtendimento();
    }

    function mostrarPainelAtendimento() {
        document.getElementById('divLogin').style.display = 'none';
        document.getElementById('divPainel').style.display = 'block';

        document.getElementById('tituloSala').innerText = meuConsultorioAtual;
        document.getElementById('subMedico').innerText = meuMedicoAtual;

        filtrarMinhaFila();
    }

    function trocarConsultorio() {
        localStorage.removeItem('medico_consultorio');
        localStorage.removeItem('medico_nome');
        document.getElementById('divPainel').style.display = 'none';
        document.getElementById('divLogin').style.display = 'block';
    }

    function chamarProximo() {
        socket.emit('medico-chamar-proximo', { consultorio: meuConsultorioAtual });
    }

    function rechamar() {
        if (ultimoChamadoPorMim) {
            socket.emit('medico-rechamar', ultimoChamadoPorMim);
        }
    }

    function filtrarMinhaFila() {
        if (!meuConsultorioAtual) return;

        const filtrados = filaCompleta.filter(p => p.consultorio.toLowerCase() === meuConsultorioAtual.toLowerCase());

        document.getElementById('qtdSala').innerText = filtrados.length;
        const container = document.getElementById('minhaFila');

        if (filtrados.length === 0) {
            container.innerHTML = '<div style="color: #94a3b8; text-align: center; padding: 24px; font-size: 0.9rem;">Nenhum paciente aguardando</div>';
            return;
        }

        container.innerHTML = filtrados.map(p => `
            <div class="fila-item">
                <div>
                    <strong style="color: #0f4c81;">${p.senha}</strong>
                    <span style="color: #cbd5e1; margin: 0 6px;">|</span>
                    <span style="color: #0f172a; font-weight: 600;">${p.nome}</span>
                </div>
                <div>
                    <small style="color: ${p.preferencial ? '#b45309' : '#64748b'}; font-weight: 600; font-size: 0.8rem;">${p.preferencial ? 'Prioritário' : 'Convencional'}</small>
                </div>
            </div>
        `).join('');
    }

    socket.on('estado-inicial', (dados) => {
        filaCompleta = dados.fila;
        filtrarMinhaFila();
    });

    socket.on('atualizar-fila', (fila) => {
        filaCompleta = fila;
        filtrarMinhaFila();
    });

    socket.on('atualizar-painel', (dados) => {
        if (dados.ultima && dados.ultima.destino && dados.ultima.destino.toLowerCase().includes(meuConsultorioAtual.toLowerCase())) {
            ultimoChamadoPorMim = {
                senha: dados.ultima.senha,
                nome: dados.ultima.nome,
                consultorio: meuConsultorioAtual,
                medico: meuMedicoAtual,
                horarioEntrada: dados.ultima.horarioEntrada
            };
            document.getElementById('pacienteAtual').innerText = `${dados.ultima.senha} — ${dados.ultima.nome}`;
            document.getElementById('btnRechamar').style.display = 'block';
        }
    });

    socket.on('aviso-medico', (msg) => alert(msg));
</script>
</body>
</html>
